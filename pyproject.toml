[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roubi"
dynamic = ["version"]
description = "A dependency-free TCP network scanner with structured reporting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Khaled Roubi", email = "ropyk801@gmail.com" }]
keywords = ["security", "network", "scanner", "port-scanner", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
roubi = "roubi.cli:main"

[project.urls]
Homepage = "https://github.com/c-roubi/roubi-network-scanner"
Repository = "https://github.com/c-roubi/roubi-network-scanner"
Issues = "https://github.com/c-roubi/roubi-network-scanner/issues"

[tool.hatch.version]
path = "src/roubi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/roubi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
